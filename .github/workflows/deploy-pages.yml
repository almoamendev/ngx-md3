name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.version-check.outputs.should-deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Docs only redeploys when the workspace root package.json's version
      # is bumped — the same "only ship on a version bump" gate the npm
      # publish workflow uses, just diffed against git history here since
      # there's no registry to check a "currently deployed" version against.
      # Manual (workflow_dispatch) runs always build, ignoring this check.
      - name: Check whether the root package.json version changed
        id: version-check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Manually triggered — building regardless of version."
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            PREVIOUS_VERSION=$(git show "${{ github.event.before }}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || echo "")
          else
            PREVIOUS_VERSION=""
          fi

          echo "Current version:  $CURRENT_VERSION"
          echo "Previous version: $PREVIOUS_VERSION"

          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # docs imports @vip9008/ngx-md3 via a tsconfig path mapped to
      # ./dist/ngx-md3 (not the library source), so that output has to exist
      # — and be current — before the docs app can build.
      - name: Build library
        run: npx ng build ngx-md3

      # Project Pages site (https://<user>.github.io/ngx-md3/) is served from
      # a subpath, so routerLinks/asset URLs need that base baked in at build
      # time. Change this (or drop it) if you switch to a custom domain or a
      # user/org root page, where the app is served from "/".
      - name: Build docs
        run: npx ng build docs --configuration production --base-href /ngx-md3/

      # Angular is a client-side-routed SPA — GitHub Pages has no concept of
      # that, so a direct hit / refresh on a deep route 404s. Serving
      # index.html for 404s hands control back to Angular's router, which
      # then renders the right route from the URL.
      - name: Add SPA fallback for client-side routing
        run: cp dist/docs/browser/index.html dist/docs/browser/404.html

      # Stop GitHub Pages from running the output through Jekyll.
      - name: Disable Jekyll processing
        run: touch dist/docs/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
