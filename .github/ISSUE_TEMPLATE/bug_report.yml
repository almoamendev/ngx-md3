name: "Library bug: component behavior"
description: A component isn't rendering or behaving correctly
title: "[Bug][Library]: "
labels: ["bug", "library"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you give, the faster this gets fixed.

        This template is for the **library** (`@almoamendev/ngx-md3` — component code, styles, behavior). If the problem is with the docs site itself (broken page, wrong example, typo), use the "Docs site bug" template instead.

  - type: input
    id: component
    attributes:
      label: Component
      description: Which component(s) are affected? (e.g. Button, Text field, Navigation rail)
      placeholder: e.g. Text field
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Add `<md3-text-field ...>` with ...
        2. Do ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: repro-link
    attributes:
      label: Minimal reproduction (recommended)
      description: A StackBlitz, CodeSandbox, or small repo that reproduces the issue. This is the single fastest way to get a fix.
      placeholder: https://stackblitz.com/...

  - type: input
    id: ngx-md3-version
    attributes:
      label: ngx-md3 version
      placeholder: e.g. 0.0.8
    validations:
      required: true

  - type: input
    id: angular-version
    attributes:
      label: Angular version
      placeholder: e.g. 22.0.0
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other (mention in description)

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this hasn't been reported yet
          required: true
