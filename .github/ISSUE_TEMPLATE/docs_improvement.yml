name: "Docs improvement"
description: Request a new example, guide, or clearer explanation on the docs site
title: "[Docs]: "
labels: ["enhancement", "documentation"]
body:
  - type: markdown
    attributes:
      value: |
        For library API/component requests, use the "Library feature request" template instead.

  - type: input
    id: page-url
    attributes:
      label: Related page (if any)
      placeholder: https://almoamendev.github.io/ngx-md3/components/text-field

  - type: textarea
    id: problem
    attributes:
      label: What's missing or unclear?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to see instead?

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this hasn't been requested yet
          required: true
