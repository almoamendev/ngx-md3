<md3-side-sheet-header title="Styles">
    <button type="button" md3-icon-button leading button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>arrow_back</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body>
    <md3-nav-group>
        <a routerLink="/styles/typography" md3-nav-item>
            <md3-icon md3-icon-element>type_specimen</md3-icon>
            <md3-icon md3-icon-element="active" filled>type_specimen</md3-icon>
            Typography
        </a>
    </md3-nav-group>
    <md3-divider></md3-divider>
    <md3-nav-group label="Tokens">
        <a routerLink="/styles/color" md3-nav-item>
            <md3-icon md3-icon-element>palette</md3-icon>
            <md3-icon md3-icon-element="active" filled>palette</md3-icon>
            Color
        </a>
        <a routerLink="/styles/elevation" md3-nav-item>
            <md3-icon md3-icon-element>layers</md3-icon>
            <md3-icon md3-icon-element="active" filled>layers</md3-icon>
            Elevation
        </a>
        <a routerLink="/styles/shape" md3-nav-item>
            <md3-icon md3-icon-element>rounded_corner</md3-icon>
            <md3-icon md3-icon-element="active" filled>rounded_corner</md3-icon>
            Shape
        </a>
        <a routerLink="/styles/motion" md3-nav-item>
            <md3-icon md3-icon-element>animation</md3-icon>
            <md3-icon md3-icon-element="active" filled>animation</md3-icon>

        </a>
        <a routerLink="/styles/grid" md3-nav-item>
            <md3-icon md3-icon-element>calendar_view_week</md3-icon>
            <md3-icon md3-icon-element="active" filled>calendar_view_week</md3-icon>
            Grid
        </a>
    </md3-nav-group>
</md3-side-sheet-body>
