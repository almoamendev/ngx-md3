<md3-scaffold>
    <md3-app-bar app-bar-type="center-aligned" elevated md3-scaffold-bar="top">
        <button md3-icon-button md3-app-bar-navigation aria-label="Menu">
            <md3-icon md3-icon-element>menu</md3-icon>
        </button>

        <span md3-app-bar-title>Inbox</span>

        <button md3-icon-button md3-app-bar-action aria-label="Search">
            <md3-icon md3-icon-element>search</md3-icon>
        </button>
        <button md3-icon-button md3-app-bar-action aria-label="Search">
            <md3-icon md3-icon-element>search</md3-icon>
        </button>
    </md3-app-bar>

    <md3-navigation-rail md3-scaffold-rail="leading">
        <button type="button" md3-fab>
            <md3-icon md3-icon-element>edit</md3-icon>
            Label
        </button>

        <button type="button" md3-nav-item>
            <md3-icon md3-icon-element>add_circle</md3-icon>
            <md3-icon md3-icon-element="active" filled>add_circle</md3-icon>
            Components
        </button>
        <md3-nav-group label="Components" hide-on-collapse>
            <a routerLink="components/buttons/button-groups" md3-nav-item>
                Button groups
            </a>
            <a routerLink="components/buttons/buttons" md3-nav-item>
                Buttons
            </a>
            <a routerLink="components/buttons/floating-action-buttons" md3-nav-item>
                FABs
            </a>
            <a routerLink="components/buttons/icon-buttons" md3-nav-item>
                Icon buttons
            </a>
            <a routerLink="components/buttons/split-buttons" md3-nav-item>
                Split buttons
            </a>
        </md3-nav-group>
    </md3-navigation-rail>

    <md3-navigation-bar md3-scaffold-bar="bottom">
        <button type="button" md3-nav-item>
            <md3-badge small></md3-badge>
            <md3-icon md3-icon-element>add_circle</md3-icon>
            <md3-icon md3-icon-element="active" filled>add_circle</md3-icon>
            Components 1
        </button>
        <button type="button" md3-nav-item>
            <md3-badge>9</md3-badge>
            <md3-icon md3-icon-element>add_circle</md3-icon>
            <md3-icon md3-icon-element="active" filled>add_circle</md3-icon>
            Components 2
        </button>
        <button type="button" md3-nav-item>
            <md3-badge>999+</md3-badge>
            <md3-icon md3-icon-element>add_circle</md3-icon>
            <md3-icon md3-icon-element="active" filled>add_circle</md3-icon>
            Components 3
        </button>
    </md3-navigation-bar>

    <div md3-scaffold-pane>
        <section style="padding: 1rem 2rem; display: flex; gap: 1rem;">
            <ul>
                <li><a routerLink="styles/typography">Typography</a></li>
            </ul>
            <ul>
                <li><a routerLink="components/cards">Cards</a></li>
            </ul>
            <ul>
                <li><a routerLink="components/chips">Chips</a></li>
            </ul>
            <ul>
                <li><a routerLink="components/checkboxes">Checkboxes</a></li>
                <li><a routerLink="components/switches">Switches</a></li>
                <li><a routerLink="components/radio-buttons">Radio Buttons</a></li>
                <li><a routerLink="components/sliders">Sliders</a></li>
            </ul>
            <ul>
                <li><a routerLink="components/lists">Lists</a></li>
            </ul>
            <ul>
                <li><a routerLink="components/loading-and-progress/loading-indicators">Loading indicators</a></li>
                <li><a routerLink="components/loading-and-progress/progress-indicators">Progress indicators</a></li>
            </ul>
            <ul>
                <li><a routerLink="components/menus">Menus</a></li>
            </ul>
            <ul>
                <li><a routerLink="components/navigations/navigation-rail">Navigation rail</a></li>
            </ul>
            <ul>
                <li><a routerLink="components/text-fields">Text fields</a></li>
            </ul>
            <ul>
                <li><a routerLink="components/dialogs">Dialogs</a></li>
            </ul>
        </section>

        <section class="main-content" style="padding: 1rem 2rem;">
            <router-outlet></router-outlet>
        </section>
    </div>
</md3-scaffold>
