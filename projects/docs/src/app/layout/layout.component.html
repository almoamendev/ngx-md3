        <div md3-app-bar-trailing>
            <md3-switch [control]="darkModeControl" style="margin-inline-end: 0.75em;">
                <input md3-input-element type="checkbox" />
                <md3-icon md3-icon-element="unselected">light_mode</md3-icon>
                <md3-icon md3-icon-element="selected">dark_mode</md3-icon>
            </md3-switch>
        </div>
    </md3-app-bar>

    <md3-navigation-rail md3-scaffold-rail="leading" [class.menu-button]="showMenuBtn()" [hide-menu-button]="!showMenuBtn()" [(expanded)]="expandedRail">
        <button type="button" md3-nav-item (click)="openMenu(groupType.FOUNDATIONS)" [class.md3-active]="currentGroup() == groupType.FOUNDATIONS">
            <md3-icon md3-icon-element>book</md3-icon>
            <md3-icon md3-icon-element="active" filled>book</md3-icon>
            Foundations
        </button>

        <button type="button" md3-nav-item (click)="openMenu(groupType.STYLES)" [class.md3-active]="currentGroup() == groupType.STYLES">
            <md3-icon md3-icon-element>palette</md3-icon>
            <md3-icon md3-icon-element="active" filled>palette</md3-icon>
            Style
        </button>

        <button type="button" md3-nav-item (click)="openMenu(groupType.COMPONENTS)" [class.md3-active]="currentGroup() == groupType.COMPONENTS">
            <md3-icon md3-icon-element>add_circle</md3-icon>
            <md3-icon md3-icon-element="active" filled>add_circle</md3-icon>
            Components
        </button>

        <!-- <md3-nav-group label="Components" hide-on-collapse>

    <main md3-scaffold-pane="main">
        <div class="main-content">
            <section style="padding: 1rem 2rem;">
                <router-outlet></router-outlet>
            </section>
        </div>
        <div class="surface-frame"></div>
    </main>
