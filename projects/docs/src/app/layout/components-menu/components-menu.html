<md3-side-sheet-header title="Components">
    <button type="button" md3-icon-button leading button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>arrow_back</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body>
    <md3-nav-group>
        <a routerLink="/components" md3-nav-item [routerLinkActiveOptions]="{ exact: true }">
            <md3-icon md3-icon-element>apps</md3-icon>
            <md3-icon md3-icon-element="active" filled>apps</md3-icon>
            All components
            <md3-badge>{{ componentsCount }}</md3-badge>
        </a>
    </md3-nav-group>

    @for (section of sections; track section.label) {
        <md3-divider></md3-divider>
        <md3-nav-group [label]="section.label">
            @for (entry of section.entries; track entry.link) {
                <a [routerLink]="entry.link" md3-nav-item>
                    <md3-icon md3-icon-element>deployed_code</md3-icon>
                    <md3-icon md3-icon-element="active" filled>deployed_code</md3-icon>
                    {{ entry.label }}
                </a>
            }
        </md3-nav-group>
    }
</md3-side-sheet-body>
