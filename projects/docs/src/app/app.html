<section style="padding: 1rem 2rem;">
    <div class="md-scheme-dark" style="border-radius: 1rem; padding: 1rem;">
        <h1>DEMO - Dark</h1>
        <md3-loading-indicator [size]="120"></md3-loading-indicator>
        <md3-loading-indicator [size]="120" [contained]="true"></md3-loading-indicator>

        <md3-linear-progress-indicator [progress]="50"></md3-linear-progress-indicator>
        <div style="padding: 0.5rem;"></div>
        <md3-linear-progress-indicator [thickness]="8" [progress]="50"></md3-linear-progress-indicator>
        <div style="padding: 0.5rem;"></div>

        <md3-linear-progress-indicator [indeterminate]="true"></md3-linear-progress-indicator>
        <div style="padding: 0.5rem;"></div>
        <md3-linear-progress-indicator [thickness]="8" [indeterminate]="true"></md3-linear-progress-indicator>
        <div style="padding: 0.5rem;"></div>

        <md3-circular-progress-indicator [progress]="50"></md3-circular-progress-indicator>
        <div style="padding: 0.5rem;"></div>
        <md3-circular-progress-indicator [thickness]="8" [progress]="50"></md3-circular-progress-indicator>
        <div style="padding: 0.5rem;"></div>
    </div>
    <div class="md-scheme-light" style="border-radius: 1rem; padding: 1rem;">
        <h1>DEMO - Light</h1>
        <md3-loading-indicator></md3-loading-indicator>
        <md3-loading-indicator [contained]="true"></md3-loading-indicator>

        <md3-linear-progress-indicator [progress]="50"></md3-linear-progress-indicator>
        <div style="padding: 0.5rem;"></div>
        <md3-linear-progress-indicator [thickness]="8" [progress]="50"></md3-linear-progress-indicator>
        <div style="padding: 0.5rem;"></div>

        <md3-linear-progress-indicator [indeterminate]="true"></md3-linear-progress-indicator>
        <div style="padding: 0.5rem;"></div>
        <md3-linear-progress-indicator [thickness]="8" [indeterminate]="true"></md3-linear-progress-indicator>
        <div style="padding: 0.5rem;"></div>

        <md3-circular-progress-indicator [progress]="50"></md3-circular-progress-indicator>
        <div style="padding: 0.5rem;"></div>
        <md3-circular-progress-indicator [thickness]="8" [progress]="50"></md3-circular-progress-indicator>
        <div style="padding: 0.5rem;"></div>
    </div>
</section>
