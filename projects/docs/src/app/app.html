<section style="padding: 1rem 2rem;">
    <div class="md-scheme-dark" style="border-radius: 1rem; padding: 1rem;">
        <h1>DEMO - Dark</h1>
        <div style="padding: 0.5rem;"></div>
        <md3-icon>check_box</md3-icon>
        <md3-icon [filled]="true">check_box</md3-icon>
        <md3-icon [biDirectional]="true" dir="rtl">check_box</md3-icon>
        <div style="padding: 0.5rem;"></div>
        <md3-icon iconStyle="outlined">check_box</md3-icon>
        <md3-icon iconStyle="rounded">check_box</md3-icon>
        <md3-icon iconStyle="sharp">check_box</md3-icon>
        <div style="padding: 0.5rem;"></div>
        <md3-icon [filled]="true" iconStyle="outlined">check_box</md3-icon>
        <md3-icon [filled]="true" iconStyle="rounded">check_box</md3-icon>
        <md3-icon [filled]="true" iconStyle="sharp">check_box</md3-icon>
        <div style="padding: 0.5rem;"></div>
        <md3-icon iconVersion="MaterialIcons" iconStyle="outlined">check_box</md3-icon>
        <md3-icon iconVersion="MaterialIcons" iconStyle="rounded">check_box</md3-icon>
        <md3-icon iconVersion="MaterialIcons" iconStyle="sharp">check_box</md3-icon>
        <md3-icon iconVersion="MaterialIcons" iconStyle="two-tone">check_box</md3-icon>
    </div>
    <div class="md-scheme-light" style="border-radius: 1rem; padding: 1rem;">
        <h1>DEMO - Light</h1>
        <div style="padding: 0.5rem;"></div>
    </div>
</section>
