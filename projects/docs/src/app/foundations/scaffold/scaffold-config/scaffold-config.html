<md3-side-sheet-header title="Configurations">
    <button type="button" md3-icon-button trailing button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>close</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body class="md3-component-config">
    <div md3-type-body size="large">Bars</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Top bar</div>
            <md3-switch disable-state-layer [control]="showTopBar">
                <input type="checkbox" md3-input-element name="show-top-bar">
            </md3-switch>
        </label>
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Bottom bar</div>
            <md3-switch disable-state-layer [control]="showBottomBar">
                <input type="checkbox" md3-input-element name="show-bottom-bar">
            </md3-switch>
        </label>
    </div>

    <div md3-type-body size="large">Rails</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Leading rail</div>
            <md3-switch disable-state-layer [control]="showLeadingRail">
                <input type="checkbox" md3-input-element name="show-leading-rail">
            </md3-switch>
        </label>
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Trailing rail</div>
            <md3-switch disable-state-layer [control]="showTrailingRail">
                <input type="checkbox" md3-input-element name="show-trailing-rail">
            </md3-switch>
        </label>
    </div>

    <div md3-type-body size="large">Panes</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Start pane</div>
            <md3-switch disable-state-layer [control]="showStartPane">
                <input type="checkbox" md3-input-element name="show-start-pane">
            </md3-switch>
        </label>
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">End pane</div>
            <md3-switch disable-state-layer [control]="showEndPane">
                <input type="checkbox" md3-input-element name="show-end-pane">
            </md3-switch>
        </label>
    </div>
</md3-side-sheet-body>
