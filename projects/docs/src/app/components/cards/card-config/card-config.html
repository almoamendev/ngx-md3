<md3-side-sheet-header title="Configurations">
    <button type="button" md3-icon-button trailing button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>close</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body class="md3-component-config">
    <div md3-type-body size="large">Type</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="cardType">
                <input type="radio" md3-input-element name="card-type" value="elevated">
            </md3-radio-button>
            <div md3-type-label size="large">Elevated</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="cardType">
                <input type="radio" md3-input-element name="card-type" value="filled">
            </md3-radio-button>
            <div md3-type-label size="large">Filled</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="cardType">
                <input type="radio" md3-input-element name="card-type" value="outlined">
            </md3-radio-button>
            <div md3-type-label size="large">Outlined</div>
        </label>
    </div>
    
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Interactive card</div>
            <md3-switch disable-state-layer [control]="interactive">
                <input type="checkbox" md3-input-element name="card-interactive">
            </md3-switch>
        </label>
    </div>
</md3-side-sheet-body>
