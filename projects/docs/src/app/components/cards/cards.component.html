<h1>Cards</h1>

<ul>
    <li>@Input() card-type: 'elevated' | 'filled' | 'outlined' = 'elevated';</li>
</ul>

<md3-card card-type="elevated" style="margin-bottom: 1rem;">
    <p style="margin: 0; padding: 2rem 2rem;">Elevated</p>
</md3-card>
<md3-card card-type="filled" style="margin-bottom: 1rem;">
    <p style="margin: 0; padding: 2rem 2rem;">Filled</p>
</md3-card>
<md3-card card-type="outlined" style="margin-bottom: 1rem;">
    <p style="margin: 0; padding: 2rem 2rem;">Outlined</p>
</md3-card>
