<h1>Cards</h1>

<ul>
    <li>@Input() cardType: 'elevated' | 'filled' | 'outlined' = 'elevated';</li>
</ul>

<md3-card cardType="elevated" style="margin-bottom: 1rem;">
    <p style="margin: 0; padding: 2rem 2rem;">Elevated</p>
</md3-card>
<md3-card cardType="filled" style="margin-bottom: 1rem;">
    <p style="margin: 0; padding: 2rem 2rem;">Filled</p>
</md3-card>
<md3-card cardType="outlined" style="margin-bottom: 1rem;">
    <p style="margin: 0; padding: 2rem 2rem;">Outlined</p>
</md3-card>
