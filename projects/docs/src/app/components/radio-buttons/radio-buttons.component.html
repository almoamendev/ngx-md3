<h1>Radio buttons</h1>

<ul>
    <li>@Input() disable-state-layer: boolean = false;</li>
    <li>@Input() control?: AbstractControl;</li>
</ul>

<div class="radio-demo-row">
    <md3-radio-button>
        <input type="radio" name="radio-demo-state" md3-input-element checked>
    </md3-radio-button>
    <md3-radio-button>
        <input type="radio" name="radio-demo-state" md3-input-element aria-invalid="true">
    </md3-radio-button>
    <md3-radio-button>
        <input type="radio" name="radio-demo-disabled" md3-input-element disabled>
    </md3-radio-button>
    <md3-radio-button>
        <input type="radio" name="radio-demo-disabled" md3-input-element disabled checked>
    </md3-radio-button>
</div>
