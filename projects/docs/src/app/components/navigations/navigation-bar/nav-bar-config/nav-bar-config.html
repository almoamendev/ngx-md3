<md3-side-sheet-header title="Configurations">
    <button type="button" md3-icon-button trailing button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>close</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body class="md3-component-config">
    <div md3-type-body size="large">Badge</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="badge">
                <input type="radio" md3-input-element name="badge" value="none">
            </md3-radio-button>
            <div md3-type-label size="large">None</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="badge">
                <input type="radio" md3-input-element name="badge" value="dot">
            </md3-radio-button>
            <div md3-type-label size="large">Dot</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="badge">
                <input type="radio" md3-input-element name="badge" value="count">
            </md3-radio-button>
            <div md3-type-label size="large">Count</div>
        </label>
    </div>
</md3-side-sheet-body>
