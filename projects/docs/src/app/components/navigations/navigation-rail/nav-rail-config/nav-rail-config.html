<md3-side-sheet-header title="Configurations">
    <button type="button" md3-icon-button trailing button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>close</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body class="md3-component-config">
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label="large">Expanded</div>
            <md3-switch disable-state-layer [control]="expanded">
                <input type="checkbox" md3-input-element name="expanded">
            </md3-switch>
        </label>
    </div>

    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label="large">Hide menu button</div>
            <md3-switch disable-state-layer [control]="hideMenuButton">
                <input type="checkbox" md3-input-element name="hide-menu-button">
            </md3-switch>
        </label>
    </div>

    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label="large">Full width indicator</div>
            <md3-switch disable-state-layer [control]="fullWidthIndicator">
                <input type="checkbox" md3-input-element name="full-width-indicator">
            </md3-switch>
        </label>
    </div>

    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label="large">Show FAB</div>
            <md3-switch disable-state-layer [control]="showFab">
                <input type="checkbox" md3-input-element name="show-fab">
            </md3-switch>
        </label>
    </div>
    
    <div md3-type-body="large">Badge</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="badge">
                <input type="radio" md3-input-element name="badge" value="none">
            </md3-radio-button>
            <div md3-type-label="large">None</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="badge">
                <input type="radio" md3-input-element name="badge" value="dot">
            </md3-radio-button>
            <div md3-type-label="large">Dot</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="badge">
                <input type="radio" md3-input-element name="badge" value="count">
            </md3-radio-button>
            <div md3-type-label="large">Count</div>
        </label>
    </div>

    <div md3-type-body="large">Container style</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="containerStyle">
                <input type="radio" md3-input-element name="container-style" value="none">
            </md3-radio-button>
            <div md3-type-label="large">None</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="containerStyle">
                <input type="radio" md3-input-element name="container-style" value="elevated">
            </md3-radio-button>
            <div md3-type-label="large">Elevated</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="containerStyle">
                <input type="radio" md3-input-element name="container-style" value="divider">
            </md3-radio-button>
            <div md3-type-label="large">Divider</div>
        </label>
    </div>

    <div md3-type-body="large">Collapsed layout</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="collapsedLayout">
                <input type="radio" md3-input-element name="collapsed-layout" value="compact">
            </md3-radio-button>
            <div md3-type-label="large">Compact</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="collapsedLayout">
                <input type="radio" md3-input-element name="collapsed-layout" value="narrow">
            </md3-radio-button>
            <div md3-type-label="large">Narrow</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="collapsedLayout">
                <input type="radio" md3-input-element name="collapsed-layout" value="hidden">
            </md3-radio-button>
            <div md3-type-label="large">Hidden</div>
        </label>
    </div>

    <div md3-type-body="large">Expanded layout</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="expandedLayout">
                <input type="radio" md3-input-element name="expanded-layout" value="standard">
            </md3-radio-button>
            <div md3-type-label="large">Standard</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="expandedLayout">
                <input type="radio" md3-input-element name="expanded-layout" value="modal">
            </md3-radio-button>
            <div md3-type-label="large">Modal</div>
        </label>
    </div>
</md3-side-sheet-body>
