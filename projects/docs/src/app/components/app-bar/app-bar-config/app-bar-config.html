<md3-side-sheet-header title="Configurations">
    <button type="button" md3-icon-button trailing button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>close</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body class="md3-component-config">
    <div md3-type-body size="large">Size</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="barType">
                <input type="radio" md3-input-element name="app-bar-type" value="small">
            </md3-radio-button>
            <div md3-type-label size="large">Small</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="barType">
                <input type="radio" md3-input-element name="app-bar-type" value="medium">
            </md3-radio-button>
            <div md3-type-label size="large">Medium</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="barType">
                <input type="radio" md3-input-element name="app-bar-type" value="large">
            </md3-radio-button>
            <div md3-type-label size="large">Large</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="barType">
                <input type="radio" md3-input-element name="app-bar-type" value="search">
            </md3-radio-button>
            <div md3-type-label size="large">Search</div>
        </label>
    </div>

    <div md3-type-body size="large">Scroll style</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="scrollStyle">
                <input type="radio" md3-input-element name="app-bar-scroll-style" value="none">
            </md3-radio-button>
            <div md3-type-label size="large">None</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="scrollStyle">
                <input type="radio" md3-input-element name="app-bar-scroll-style" value="transparent">
            </md3-radio-button>
            <div md3-type-label size="large">Transparent</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="scrollStyle">
                <input type="radio" md3-input-element name="app-bar-scroll-style" value="elevate">
            </md3-radio-button>
            <div md3-type-label size="large">Elevate</div>
        </label>
    </div>

    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Auto-hide</div>
            <md3-switch disable-state-layer [control]="autoHide">
                <input type="checkbox" md3-input-element name="app-bar-auto-hide">
            </md3-switch>
        </label>
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Center aligned</div>
            <md3-switch disable-state-layer [control]="centerAligned">
                <input type="checkbox" md3-input-element name="app-bar-center-aligned">
            </md3-switch>
        </label>
    </div>
</md3-side-sheet-body>
