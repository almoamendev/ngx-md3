<h1>Chips</h1>

<p>
    Chips help people enter information, make selections, filter content, or trigger actions.
</p>

<section>
    <h2>Assist chips</h2>

    <div style="display: flex; gap: 1em; flex-wrap: wrap;">
        <button md3-chip chip-type="assist">
            <md3-icon md3-icon-element="leading">event</md3-icon>
            Add to calendar
        </button>
        <button md3-chip chip-type="assist" disabled>
            <md3-icon md3-icon-element="leading">event</md3-icon>
            Add to calendar
        </button>
        <button md3-chip chip-type="assist" surface>
            <md3-icon md3-icon-element="leading">event</md3-icon>
            Add to calendar
        </button>
        <button md3-chip chip-type="assist" surface disabled>
            <md3-icon md3-icon-element="leading">event</md3-icon>
            Add to calendar
        </button>
        <button md3-chip chip-type="assist" elevated>
            <md3-icon md3-icon-element="leading">notifications</md3-icon>
            Set reminder
        </button>
        <button md3-chip chip-type="assist" elevated disabled>
            <md3-icon md3-icon-element="leading">notifications</md3-icon>
            Set reminder
        </button>
    </div>
</section>
<section>
    <h2>Filter chips</h2>

    <div style="display: flex; gap: 1em; flex-wrap: wrap;">
        <label md3-chip chip-type="filter">
            <input type="checkbox" md3-input-element>
            Vegetarian
        </label>
        <label md3-chip chip-type="filter">
            <input type="checkbox" md3-input-element checked>
            Breakfast
        </label>
        <label md3-chip chip-type="filter">
            <input type="checkbox" md3-input-element disabled>
            Open now
        </label>
        <label md3-chip chip-type="filter">
            <input type="checkbox" md3-input-element disabled checked>
            Disabled
        </label>
    </div>
    
    <div style="display: flex; gap: 1em; flex-wrap: wrap;">
        <label md3-chip chip-type="filter" elevated>
            <input type="checkbox" md3-input-element>
            Vegetarian
        </label>
        <label md3-chip chip-type="filter" elevated>
            <input type="checkbox" md3-input-element checked>
            Breakfast
        </label>
        <label md3-chip chip-type="filter" elevated>
            <input type="checkbox" md3-input-element disabled>
            Open now
        </label>
        <label md3-chip chip-type="filter" elevated>
            <input type="checkbox" md3-input-element disabled checked>
            Disabled
        </label>
    </div>
</section>
<section>
    <h2>Input chips</h2>
    <div style="display: flex; gap: 1em; flex-wrap: wrap;">
        <label md3-chip chip-type="input">
            <input type="checkbox" md3-input-element>
            Material
        </label>
        <label md3-chip chip-type="input">
            <input type="checkbox" md3-input-element disabled>
            Add to calendar
        </label>
        <label md3-chip chip-type="input">
            <input type="checkbox" md3-input-element checked disabled>
            <md3-icon md3-icon-element="leading">notifications</md3-icon>
            Set reminder
        </label>
        <label md3-chip chip-type="input">
            <input type="checkbox" md3-input-element disabled>
            <md3-icon md3-chip-avatar>person</md3-icon>
            Contact number
        </label>
    </div>

    <div style="display: flex; gap: 1em; flex-wrap: wrap;">
        <label md3-chip chip-type="input" elevated>
            <input type="checkbox" md3-input-element>
            Material
        </label>
        <label md3-chip chip-type="input" elevated>
            <input type="checkbox" md3-input-element disabled>
            Add to calendar
        </label>
        <label md3-chip chip-type="input" elevated>
            <input type="checkbox" md3-input-element checked disabled>
            <md3-icon md3-icon-element="leading">notifications</md3-icon>
            Set reminder
        </label>
        <label md3-chip chip-type="input" elevated>
            <input type="checkbox" md3-input-element disabled>
            <md3-icon md3-chip-avatar>person</md3-icon>
            Contact number
        </label>
    </div>
</section>

<section>
    <h2>Suggestion chips</h2>

    <div style="display: flex; gap: 1em; flex-wrap: wrap;">
        <button md3-chip chip-type="suggestion">
            Vegetarian
        </button>
        <button md3-chip chip-type="filter">
            <md3-icon md3-icon-element="leading">notifications</md3-icon>
            Breakfast
            <md3-icon md3-icon-element="trailing">person</md3-icon>
        </button>
        <button md3-chip chip-type="suggestion">
            <md3-icon md3-chip-avatar>person</md3-icon>
            Open now
        </button>
        <button md3-chip chip-type="suggestion" disabled>
            Disabled
        </button>
    </div>
</section>
