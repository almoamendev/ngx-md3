<md3-side-sheet-header title="Configurations">
    <button type="button" md3-icon-button trailing button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>close</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body class="md3-component-config">
    <div md3-type-body="large">Type</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="chipType">
                <input type="radio" md3-input-element name="chip-type" value="assist">
            </md3-radio-button>
            <div md3-type-label="large">Assist</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="chipType">
                <input type="radio" md3-input-element name="chip-type" value="filter">
            </md3-radio-button>
            <div md3-type-label="large">Filter</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="chipType">
                <input type="radio" md3-input-element name="chip-type" value="input">
            </md3-radio-button>
            <div md3-type-label="large">Input</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="chipType">
                <input type="radio" md3-input-element name="chip-type" value="suggestion">
            </md3-radio-button>
            <div md3-type-label="large">Suggestion</div>
        </label>
    </div>
        
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label="large">Leading icon</div>
            <md3-switch disable-state-layer [control]="leadingIcon">
                <input type="checkbox" md3-input-element name="leading-icon">
            </md3-switch>
        </label>
        <label md3-state-component tabindex="0">
            <div md3-type-label="large">Avatar</div>
            <md3-switch disable-state-layer [control]="avatar">
                <input type="checkbox" md3-input-element name="avatar">
            </md3-switch>
        </label>
        <label md3-state-component tabindex="0">
            <div md3-type-label="large">Trailing icon</div>
            <md3-switch disable-state-layer [control]="trailingIcon">
                <input type="checkbox" md3-input-element name="trailing-icon">
            </md3-switch>
        </label>
    </div>

    <div md3-type-body="large">Style</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="chipStyle">
                <input type="radio" md3-input-element name="chip-style" value="default">
            </md3-radio-button>
            <div md3-type-label="large">Default</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="chipStyle">
                <input type="radio" md3-input-element name="chip-style" value="surface">
            </md3-radio-button>
            <div md3-type-label="large">Surface</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="chipStyle">
                <input type="radio" md3-input-element name="chip-style" value="elevated">
            </md3-radio-button>
            <div md3-type-label="large">Elevated</div>
        </label>
    </div>
        
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label="large">Disable chip</div>
            <md3-switch disable-state-layer [control]="disabled">
                <input type="checkbox" md3-input-element name="disable-chip">
            </md3-switch>
        </label>
    </div>
</md3-side-sheet-body>
