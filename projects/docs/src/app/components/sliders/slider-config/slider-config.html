<md3-side-sheet-header title="Configurations">
    <button type="button" md3-icon-button trailing button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>close</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body class="md3-component-config">
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Show icon</div>
            <md3-switch disable-state-layer [control]="showIcon">
                <input type="checkbox" md3-input-element name="show-icon">
            </md3-switch>
        </label>
    </div>

    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Show value</div>
            <md3-switch disable-state-layer [control]="showValueLabel">
                <input type="checkbox" md3-input-element name="show-value">
            </md3-switch>
        </label>
    </div>

    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Disable</div>
            <md3-switch disable-state-layer [control]="disable">
                <input type="checkbox" md3-input-element name="disable">
            </md3-switch>
        </label>
    </div>

    <div md3-type-body size="large">Size</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="sliderSize">
                <input type="radio" md3-input-element name="slider-size" value="x-small">
            </md3-radio-button>
            <div md3-type-label size="large">X-Small</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="sliderSize">
                <input type="radio" md3-input-element name="slider-size" value="small">
            </md3-radio-button>
            <div md3-type-label size="large">Small</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="sliderSize">
                <input type="radio" md3-input-element name="slider-size" value="medium">
            </md3-radio-button>
            <div md3-type-label size="large">Medium</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="sliderSize">
                <input type="radio" md3-input-element name="slider-size" value="large">
            </md3-radio-button>
            <div md3-type-label size="large">Large</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="sliderSize">
                <input type="radio" md3-input-element name="slider-size" value="x-large">
            </md3-radio-button>
            <div md3-type-label size="large">X-Large</div>
        </label>
    </div>
</md3-side-sheet-body>
