<md3-side-sheet-header title="Configurations">
    <button type="button" md3-icon-button trailing button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>close</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body class="md3-component-config">
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label="large">Scrim close event</div>
            <md3-switch disable-state-layer [control]="closeEvents">
                <input type="checkbox" md3-input-element name="scrim-close">
            </md3-switch>
        </label>
        <label md3-state-component tabindex="0">
            <div md3-type-label="large">Show icon</div>
            <md3-switch disable-state-layer [control]="showIcon">
                <input type="checkbox" md3-input-element name="show-icon">
            </md3-switch>
        </label>
        <label md3-state-component tabindex="0">
            <div md3-type-label="large">Dark mode</div>
            <md3-switch disable-state-layer [control]="darkMode">
                <input type="checkbox" md3-input-element name="dark-mode">
            </md3-switch>
        </label>
    </div>

    <div md3-type-body="large">Selection</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="direction">
                <input type="radio" md3-input-element name="dialog-dir" value="ltr">
            </md3-radio-button>
            <div md3-type-label="large">LTR</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="direction">
                <input type="radio" md3-input-element name="dialog-dir" value="rtl">
            </md3-radio-button>
            <div md3-type-label="large">RTL</div>
        </label>
    </div>
</md3-side-sheet-body>
