<md3-fullscreen-dialog-header>
    <button type="button" md3-icon-button md3-header-leading button-type="standard" (click)="close()">
        <md3-icon md3-icon-element bi-directional>arrow_back</md3-icon>
    </button>
    <span md3-type-title size="large">Full screen dialog</span>
    <button md3-header-trailing type="button" md3-button button-type="text" (click)="close(true)">Save</button>
</md3-fullscreen-dialog-header>

<md3-dialog-body>
    <p md3-type-body size="medium">
        A full screen dialog fills the window and holds a whole task, instead of a
        single decision. It brings its own start and end panes, so side sheets open
        inside it just like they do in the scaffold.
    </p>
    <p md3-type-body size="medium">
        Dialogs opened from here stack on top of this one and leave it alone.
    </p>

    <button type="button" md3-button button-type="filled" (click)="openSideSheet()">Open side sheet</button>
    <button type="button" md3-button button-type="text" (click)="openDialog()">Open dialog on top</button>
</md3-dialog-body>
