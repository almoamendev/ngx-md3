<md3-dialog-header>
    @if (showIcon()) {
        <md3-icon md3-icon-element>chat_info</md3-icon>
    }
    <span>Basic dialog title @if (level() > 1) {({{ level() }})}</span>
</md3-dialog-header>
<md3-dialog-body>
    <md3-type-body size="medium">
        A dialog is a modal window that<br>
        appears in front of app content to<br>
        provide critical information or prompt<br>
        for a dicision to be made.
    </md3-type-body>
</md3-dialog-body>
<md3-dialog-actions>
    <button type="button" md3-button button-type="text" (click)="openAnother()">Open another</button>
    <button type="button" md3-button button-type="text" (click)="hideDialog()">Hide</button>
    <button type="button" md3-button button-type="text" (click)="closeDialog()">Close</button>
</md3-dialog-actions>
