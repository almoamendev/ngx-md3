<md3-dialog-header>
    @if (showIcon) {
        <md3-icon md3-icon-element>chat_info</md3-icon>
    }
    <div>Basic dialog title</div>
</md3-dialog-header>
<md3-dialog-body>
    A dialog is a modal window that<br>
    appears in front of app content to<br>
    provide critical information or prompt<br>
    for a dicision to be made.
</md3-dialog-body>
<md3-dialog-actions>
    <button type="button" md3-button button-type="text" (click)="closeDialog()">Action 1</button>
    <button type="button" md3-button button-type="text" (click)="closeDialog()">Action 2</button>
</md3-dialog-actions>
