<h1>Split buttons</h1>

<ul>
    <li>@Input() button-size: 'x-small' | 'small' | 'medium' | 'large' | 'x-large' = 'small';</li>
    <li>@Input() button-type: 'elevated' | 'filled' | 'tonal' | 'outlined' = 'filled';</li>
    <li>@Input() flip-trailing-icon: boolean = true;</li>
</ul>

<div style="display: flex; gap: 1em; margin-bottom: 1em; flex-wrap: wrap;">
    <md3-split-button button-size="x-small" button-type="elevated">
        <button md3-icon-button md3-main-action>
            <md3-icon md3-icon-element>edit</md3-icon>
        </button>
        <button md3-icon-button (click)="openMenu($event)">
            <md3-icon md3-icon-element>keyboard_arrow_down</md3-icon>
        </button>
    </md3-split-button>

    <md3-split-button button-size="x-small" button-type="filled">
        <button md3-icon-button md3-main-action>
            <md3-icon md3-icon-element>edit</md3-icon>
        </button>
        <button md3-icon-button (click)="openMenu($event)">
            <md3-icon md3-icon-element>keyboard_arrow_down</md3-icon>
        </button>
    </md3-split-button>

    <md3-split-button button-size="x-small" button-type="tonal">
        <button md3-icon-button md3-main-action>
            <md3-icon md3-icon-element>edit</md3-icon>
        </button>
        <button md3-icon-button (click)="openMenu($event)">
            <md3-icon md3-icon-element>keyboard_arrow_down</md3-icon>
        </button>
    </md3-split-button>

    <md3-split-button button-size="x-small" button-type="outlined">
        <button md3-icon-button md3-main-action>
            <md3-icon md3-icon-element>edit</md3-icon>
        </button>
        <button md3-icon-button (click)="openMenu($event)">
            <md3-icon md3-icon-element>keyboard_arrow_down</md3-icon>
        </button>
    </md3-split-button>
</div>
