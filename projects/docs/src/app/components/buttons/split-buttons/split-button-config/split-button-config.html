<md3-side-sheet-header title="Configurations">
    <button type="button" md3-icon-button trailing button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>close</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body class="md3-component-config">
    <div md3-type-body="large">Primary button</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="primaryButton">
                <input type="radio" md3-input-element name="primary-button" value="icon">
            </md3-radio-button>
            <div md3-type-label="large">Icon</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="primaryButton">
                <input type="radio" md3-input-element name="primary-button" value="button">
            </md3-radio-button>
            <div md3-type-label="large">Button</div>
        </label>
    </div>
    <div md3-type-body="large">Size</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonSize">
                <input type="radio" md3-input-element name="button-size" value="x-small">
            </md3-radio-button>
            <div md3-type-label="large">X-Small</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonSize">
                <input type="radio" md3-input-element name="button-size" value="small">
            </md3-radio-button>
            <div md3-type-label="large">Small</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonSize">
                <input type="radio" md3-input-element name="button-size" value="medium">
            </md3-radio-button>
            <div md3-type-label="large">Medium</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonSize">
                <input type="radio" md3-input-element name="button-size" value="large">
            </md3-radio-button>
            <div md3-type-label="large">Large</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonSize">
                <input type="radio" md3-input-element name="button-size" value="x-large">
            </md3-radio-button>
            <div md3-type-label="large">X-Large</div>
        </label>
    </div>
    
    <div md3-type-body="large">Type</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonType">
                <input type="radio" md3-input-element name="button-type" value="elevated">
            </md3-radio-button>
            <div md3-type-label="large">Elevated</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonType">
                <input type="radio" md3-input-element name="button-type" value="filled">
            </md3-radio-button>
            <div md3-type-label="large">Filled</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonType">
                <input type="radio" md3-input-element name="button-type" value="tonal">
            </md3-radio-button>
            <div md3-type-label="large">Tonal</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonType">
                <input type="radio" md3-input-element name="button-type" value="outlined">
            </md3-radio-button>
            <div md3-type-label="large">Outlined</div>
        </label>
    </div>
    
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label="large">Flip trailing icon</div>
            <md3-switch disable-state-layer [control]="flipTrailingIcon">
                <input type="checkbox" md3-input-element name="flip-trailing-icon">
            </md3-switch>
        </label>
    </div>
</md3-side-sheet-body>
