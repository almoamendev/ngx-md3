<h1>Buttons</h1>

<ul>
    <li>@Input() button-size: 'x-small' | 'small' | 'medium' | 'large' | 'x-large' = 'small';</li>
    <li>@Input() button-type: 'elevated' | 'filled' | 'tonal' | 'outlined' | 'text' = 'filled';</li>
    <li>@Input() button-squared: boolean = false;</li>
    <li>@Input() selected: boolean | null = null;</li>
</ul>

<div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
    <button md3-button>Default</button>
    <button md3-button [button-squared]="true">Square button</button>
    <button md3-button>
        <md3-icon md3-icon-element>person</md3-icon>
        Default (icon)
    </button>
    <button md3-button [button-squared]="true">
        <md3-icon md3-icon-element>person</md3-icon>
        Square button (icon)
    </button>
</div>

<div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
    <button md3-button button-type="elevated">Elevated</button>
    <button md3-button button-type="elevated" [selected]="false">Toggle</button>
    <button md3-button button-type="elevated" [button-squared]="true" [selected]="false">Toggle (square)</button>
</div>

<div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
    <button md3-button button-type="filled">Filled</button>
    <button md3-button button-type="filled" [selected]="false">Toggle</button>
    <button md3-button button-type="filled" [button-squared]="true" [selected]="false">Toggle (square)</button>
</div>

<div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
    <button md3-button button-type="tonal">Tonal</button>
    <button md3-button button-type="tonal" [selected]="false">Toggle</button>
    <button md3-button button-type="tonal" [button-squared]="true" [selected]="false">Toggle (square)</button>
</div>

<div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
    <button md3-button button-type="outlined">Outlined</button>
    <button md3-button button-type="outlined" [selected]="false">Toggle</button>
    <button md3-button button-type="outlined" [button-squared]="true" [selected]="false">Toggle (square)</button>
</div>

<div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
    <button md3-button button-type="text">Text</button>
</div>

<div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
    <button md3-button button-size="x-small">x-small</button>
    <button md3-button button-size="small">small</button>
    <button md3-button button-size="medium">medium</button>
    <button md3-button button-size="large">large</button>
    <button md3-button button-size="x-large">x-large</button>
</div>

<div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
    <button md3-button button-size="x-small" [selected]="false">x-small</button>
    <button md3-button button-size="small" [selected]="false">small</button>
    <button md3-button button-size="medium" [selected]="false">medium</button>
    <button md3-button button-size="large" [selected]="false">large</button>
    <button md3-button button-size="x-large" [selected]="false">x-large</button>
</div>

<div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
    <button md3-button [button-squared]="true" button-size="x-small">x-small</button>
    <button md3-button [button-squared]="true" button-size="small">small</button>
    <button md3-button [button-squared]="true" button-size="medium">medium</button>
    <button md3-button [button-squared]="true" button-size="large">large</button>
    <button md3-button [button-squared]="true" button-size="x-large">x-large</button>
</div>

<div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
    <button md3-button [button-squared]="true" button-size="x-small" [selected]="false">x-small</button>
    <button md3-button [button-squared]="true" button-size="small" [selected]="false">small</button>
    <button md3-button [button-squared]="true" button-size="medium" [selected]="false">medium</button>
    <button md3-button [button-squared]="true" button-size="large" [selected]="false">large</button>
    <button md3-button [button-squared]="true" button-size="x-large" [selected]="false">x-large</button>
</div>
