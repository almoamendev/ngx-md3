<md3-side-sheet-header title="Configurations">
    <button type="button" md3-icon-button trailing button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>close</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body class="md3-component-config">
    <div md3-type-body="large">Size</div>
    <md3-list type="segmented">
        <label md3-list-item slots-alignment="center">
            <md3-list-leading type="selection-input">
                <md3-radio-button disable-state-layer [control]="buttonSize">
                    <input type="radio" md3-input-element name="button-size" value="x-small">
                </md3-radio-button>
            </md3-list-leading>
            <div md3-list-slot="content">X-Small</div>
        </label>
        <label md3-list-item slots-alignment="center">
            <md3-list-leading type="selection-input">
                <md3-radio-button disable-state-layer [control]="buttonSize">
                    <input type="radio" md3-input-element name="button-size" value="small">
                </md3-radio-button>
            </md3-list-leading>
            <div md3-list-slot="content">Small</div>
        </label>
        <label md3-list-item slots-alignment="center">
            <md3-list-leading type="selection-input">
                <md3-radio-button disable-state-layer [control]="buttonSize">
                    <input type="radio" md3-input-element name="button-size" value="medium">
                </md3-radio-button>
            </md3-list-leading>
            <div md3-list-slot="content">Medium</div>
        </label>
        <label md3-list-item slots-alignment="center">
            <md3-list-leading type="selection-input">
                <md3-radio-button disable-state-layer [control]="buttonSize">
                    <input type="radio" md3-input-element name="button-size" value="large">
                </md3-radio-button>
            </md3-list-leading>
            <div md3-list-slot="content">Large</div>
        </label>
        <label md3-list-item slots-alignment="center">
            <md3-list-leading type="selection-input">
                <md3-radio-button disable-state-layer [control]="buttonSize">
                    <input type="radio" md3-input-element name="button-size" value="x-large">
                </md3-radio-button>
            </md3-list-leading>
            <div md3-list-slot="content">X-Large</div>
        </label>
    </md3-list>

    <div md3-type-body="large">Size</div>
    <md3-list type="segmented">
        <label md3-list-item slots-alignment="center">
            <md3-list-leading type="selection-input">
                <md3-checkbox disable-state-layer [control]="isConntected">
                    <input type="checkbox" md3-input-element name="group-type">
                </md3-checkbox>
            </md3-list-leading>
            <div md3-list-slot="content">Connected</div>
        </label>
    </md3-list>
    
    <div md3-type-body="large">Selection</div>
    <md3-list type="segmented">
        <label md3-list-item slots-alignment="center">
            <md3-list-leading type="selection-input">
                <md3-radio-button disable-state-layer [control]="selectionType">
                    <input type="radio" md3-input-element name="selection-type" value="none">
                </md3-radio-button>
            </md3-list-leading>
            <div md3-list-slot="content">None</div>
        </label>
        <label md3-list-item slots-alignment="center">
            <md3-list-leading type="selection-input">
                <md3-radio-button disable-state-layer [control]="selectionType">
                    <input type="radio" md3-input-element name="selection-type" value="single">
                </md3-radio-button>
            </md3-list-leading>
            <div md3-list-slot="content">Single</div>
        </label>
        <label md3-list-item slots-alignment="center">
            <md3-list-leading type="selection-input">
                <md3-radio-button disable-state-layer [control]="selectionType">
                    <input type="radio" md3-input-element name="selection-type" value="multiple">
                </md3-radio-button>
            </md3-list-leading>
            <div md3-list-slot="content">Multiple</div>
        </label>
    </md3-list>
</md3-side-sheet-body>
