<h1>Button groups</h1>

<ul>
    <li>@Input() button-size: 'x-small' | 'small' | 'medium' | 'large' | 'x-large' = 'small';</li>
    <li>@Input() group-type: 'standard' | 'connected' = 'standard';</li>
    <li>@Input() selection: 'none' | 'single' | 'multiple' = 'none';</li>
</ul>

<div style="margin-bottom: 1rem;">
    <md3-button-group selection="multiple">
        <button md3-button>
            <md3-icon md3-icon-element>person</md3-icon>
            Default (left)
        </button>
        <button md3-button [selected]="true">
            <md3-icon md3-icon-element>person</md3-icon>
            Default (center)
        </button>
        <button md3-button>
            <md3-icon md3-icon-element>person</md3-icon>
            Default (right)
        </button>
    </md3-button-group>
</div>

<div style="margin-bottom: 1rem;">
    <md3-button-group selection="single">
        <button md3-button button-type="tonal">
            <md3-icon md3-icon-element>person</md3-icon>
            Default (left)
        </button>
        <button md3-button button-type="tonal" [selected]="true">
            <md3-icon md3-icon-element>person</md3-icon>
            Default (center)
        </button>
        <button md3-button button-type="tonal">
            <md3-icon md3-icon-element>person</md3-icon>
            Default (right)
        </button>
    </md3-button-group>
</div>

<div style="margin-bottom: 1rem;">
    <md3-button-group button-size="medium">
        <button md3-icon-button button-type="outlined" [button-squared]="true">
            <md3-icon md3-icon-element>person</md3-icon>
        </button>
        <button md3-icon-button button-type="outlined" [button-squared]="true">
            <md3-icon md3-icon-element>person</md3-icon>
        </button>
        <button md3-icon-button button-type="outlined" [button-squared]="true">
            <md3-icon md3-icon-element>person</md3-icon>
        </button>
    </md3-button-group>
</div>

<div style="margin-bottom: 1rem;">
    <md3-button-group group-type="connected">
        <button md3-button>
            <md3-icon md3-icon-element>person</md3-icon>
            Default (left)
        </button>
        <button md3-button>
            <md3-icon md3-icon-element>person</md3-icon>
            Default (center)
        </button>
        <button md3-button>
            <md3-icon md3-icon-element>person</md3-icon>
            Default (right)
        </button>
    </md3-button-group>
</div>

<div style="margin-bottom: 1rem;">
    <md3-button-group button-size="medium" group-type="connected" selection="multiple">
        <button md3-icon-button [button-squared]="true">
            <md3-icon md3-icon-element>person</md3-icon>
        </button>
        <button md3-icon-button [button-squared]="true" [selected]="true">
            <md3-icon md3-icon-element>person</md3-icon>
        </button>
        <button md3-icon-button [button-squared]="true">
            <md3-icon md3-icon-element>person</md3-icon>
        </button>
    </md3-button-group>
</div>
