<h1>Button groups</h1>

<figure class="component-image">
    <img src="/img/md3-button-group.png" />
    <ol>
        <li>Extra small</li>
        <li>Small</li>
        <li>Medium</li>
        <li>Large</li>
        <li>Extra large</li>
        <li>Single-select and multi-select</li>
        <li>Round and square</li>
    </ol>
</figure>

<app-playground>
    <button action-item md3-icon-button button-type="tonal" button-squared [selected]="configOpen()"
        (click)="openConfig()">
        <md3-icon md3-icon-element>settings</md3-icon>
    </button>
    
    <md3-button-group [button-size]="buttonSize()" [group-type]="groupType()" [selection]="selection()">
        <button md3-button>
            <md3-icon md3-icon-element>star</md3-icon>
            label
        </button>
        <button md3-button>
            <md3-icon md3-icon-element>star</md3-icon>
            label
        </button>
        <button md3-button>
            <md3-icon md3-icon-element>star</md3-icon>
            label
        </button>
    </md3-button-group>

    <md3-button-group [button-size]="buttonSize()" [group-type]="groupType()" [selection]="selection()">
        <button md3-icon-button>
            <md3-icon md3-icon-element>bluetooth</md3-icon>
        </button>
        <button md3-icon-button>
            <md3-icon md3-icon-element>alarm</md3-icon>
        </button>
        <button md3-icon-button>
            <md3-icon md3-icon-element>link</md3-icon>
        </button>
    </md3-button-group>
    
    <md3-button-group [button-size]="buttonSize()" [group-type]="groupType()" [selection]="selection()">
        <button md3-button>
            <md3-icon md3-icon-element>bluetooth</md3-icon>
            Bluetooth
        </button>
        <button md3-icon-button>
            <md3-icon md3-icon-element>alarm</md3-icon>
        </button>
        <button md3-icon-button>
            <md3-icon md3-icon-element>link</md3-icon>
        </button>
    </md3-button-group>

    <md3-button-group [button-size]="buttonSize()" [group-type]="groupType()" [selection]="selection()">
        <button md3-icon-button button-type="tonal" button-width="narrow">
            <md3-icon md3-icon-element>bluetooth</md3-icon>
        </button>
        <button md3-icon-button button-type="outlined" button-width="wide">
            <md3-icon md3-icon-element>alarm</md3-icon>
        </button>
        <button md3-icon-button button-type="filled" button-squared>
            <md3-icon md3-icon-element>link</md3-icon>
        </button>
    </md3-button-group>
</app-playground>
