<h1>Button groups</h1>

<md3-card class="component-container" card-type="outlined">
    <md3-button-group [button-size]="buttonSize()" [group-type]="groupType()" [selection]="selection()">
        <button md3-button>
            <md3-icon md3-icon-element>star</md3-icon>
            label
        </button>
        <button md3-button>
            <md3-icon md3-icon-element>star</md3-icon>
            label
        </button>
        <button md3-button>
            <md3-icon md3-icon-element>star</md3-icon>
            label
        </button>
    </md3-button-group>

    <md3-button-group [button-size]="buttonSize()" [group-type]="groupType()" [selection]="selection()">
        <button md3-icon-button>
            <md3-icon md3-icon-element>bluetooth</md3-icon>
        </button>
        <button md3-icon-button>
            <md3-icon md3-icon-element>alarm</md3-icon>
        </button>
        <button md3-icon-button>
            <md3-icon md3-icon-element>link</md3-icon>
        </button>
        <button md3-icon-button>
            <md3-icon md3-icon-element>wifi</md3-icon>
        </button>
    </md3-button-group>

    <md3-button-group [button-size]="buttonSize()" [group-type]="groupType()" [selection]="selection()">
        <button md3-icon-button button-type="tonal" button-width="narrow">
            <md3-icon md3-icon-element>bluetooth</md3-icon>
        </button>
        <button md3-icon-button button-type="outlined" button-squared>
            <md3-icon md3-icon-element>alarm</md3-icon>
        </button>
        <button md3-icon-button button-type="filled" button-width="wide">
            <md3-icon md3-icon-element>link</md3-icon>
        </button>
        <button md3-icon-button button-type="standard" button-squared>
            <md3-icon md3-icon-element>wifi</md3-icon>
        </button>
    </md3-button-group>

    <button class="config-button" md3-icon-button button-type="tonal" button-squared [selected]="configOpen()" (click)="openConfig()">
        <md3-icon md3-icon-element>settings</md3-icon>
    </button>
</md3-card>

<ul>
    <li>@Input() button-size: 'x-small' | 'small' | 'medium' | 'large' | 'x-large' = 'small';</li>
    <li>@Input() group-type: 'standard' | 'connected' = 'standard';</li>
    <li>@Input() selection: 'none' | 'single' | 'multiple' = 'none';</li>
</ul>
