<md3-side-sheet-header title="Configurations">
    <button type="button" md3-icon-button trailing button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>close</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body class="md3-component-config">
    <div md3-type-body size="large">Size</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonSize">
                <input type="radio" md3-input-element name="button-size" value="x-small">
            </md3-radio-button>
            <div md3-type-label size="large">X-Small</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonSize">
                <input type="radio" md3-input-element name="button-size" value="small">
            </md3-radio-button>
            <div md3-type-label size="large">Small</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonSize">
                <input type="radio" md3-input-element name="button-size" value="medium">
            </md3-radio-button>
            <div md3-type-label size="large">Medium</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonSize">
                <input type="radio" md3-input-element name="button-size" value="large">
            </md3-radio-button>
            <div md3-type-label size="large">Large</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonSize">
                <input type="radio" md3-input-element name="button-size" value="x-large">
            </md3-radio-button>
            <div md3-type-label size="large">X-Large</div>
        </label>
    </div>
    
    <div md3-type-body size="large">Type</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonType">
                <input type="radio" md3-input-element name="button-type" value="filled">
            </md3-radio-button>
            <div md3-type-label size="large">Filled</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonType">
                <input type="radio" md3-input-element name="button-type" value="tonal">
            </md3-radio-button>
            <div md3-type-label size="large">Tonal</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonType">
                <input type="radio" md3-input-element name="button-type" value="outlined">
            </md3-radio-button>
            <div md3-type-label size="large">Outlined</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonType">
                <input type="radio" md3-input-element name="button-type" value="standard">
            </md3-radio-button>
            <div md3-type-label size="large">Standard</div>
        </label>
    </div>
    
    <div md3-type-body size="large">Width</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonWidth">
                <input type="radio" md3-input-element name="button-width" value="default">
            </md3-radio-button>
            <div md3-type-label size="large">Default</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonWidth">
                <input type="radio" md3-input-element name="button-width" value="narrow">
            </md3-radio-button>
            <div md3-type-label size="large">Narrow</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="buttonWidth">
                <input type="radio" md3-input-element name="button-width" value="wide">
            </md3-radio-button>
            <div md3-type-label size="large">Wide</div>
        </label>
    </div>
    
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Square shape</div>
            <md3-switch disable-state-layer [control]="isSquared">
                <input type="checkbox" md3-input-element name="button-squared">
            </md3-switch>
        </label>
    </div>

    <div md3-type-body size="large">Selection</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="isSelected">
                <input type="radio" md3-input-element name="selected" value="none">
            </md3-radio-button>
            <div md3-type-label size="large">None</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="isSelected">
                <input type="radio" md3-input-element name="selected" value="toggle">
            </md3-radio-button>
            <div md3-type-label size="large">Toggle</div>
        </label>
    </div>
</md3-side-sheet-body>
