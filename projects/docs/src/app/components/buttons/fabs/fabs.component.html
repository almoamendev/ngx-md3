<h1>Floating Action Buttons</h1>

<ul>
    <li>@Input() button-size: 'small' | 'medium' | 'large' = 'small';</li>
    <li>@Input() button-type: 'tonal-primary' | 'tonal-secondary' | 'tonal-tertiary' | 'primary' | 'secondary' | 'tertiary' = 'tonal-primary';</li>
    <li>@Input() extended-fab: boolean = false;</li>
</ul>

<div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;">
    <button md3-fab button-size="small">
        <md3-icon md3-icon-element>person</md3-icon>
    </button>
    <button md3-fab button-size="medium">
        <md3-icon md3-icon-element>person</md3-icon>
    </button>
    <button md3-fab button-size="large">
        <md3-icon md3-icon-element>person</md3-icon>
    </button>
    <button md3-fab button-size="small" extended-fab>
        <md3-icon md3-icon-element>person</md3-icon>
        Extended button
    </button>
    <button md3-fab button-size="medium" extended-fab>
        <md3-icon md3-icon-element>person</md3-icon>
        Extended button
    </button>
    <button md3-fab button-size="large" extended-fab>
        <md3-icon md3-icon-element>person</md3-icon>
        Extended button
    </button>
</div>

<div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;">
    <button md3-fab button-type="tonal-primary" extended-fab>
        Tonal primary
    </button>
    <button md3-fab button-type="tonal-secondary" extended-fab>
        Tonal secondary
    </button>
    <button md3-fab button-type="tonal-tertiary" extended-fab>
        Tonal tertiary
    </button>
    <button md3-fab button-type="primary" extended-fab>
        Primary
    </button>
    <button md3-fab button-type="secondary" extended-fab>
        Secondary
    </button>
    <button md3-fab button-type="tertiary" extended-fab>
        Tertiary
    </button>
</div>
