<md3-side-sheet-header title="Configurations">
    <button type="button" md3-icon-button trailing button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>close</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body class="md3-component-config">
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Indeterminate</div>
            <md3-switch disable-state-layer [control]="indeterminate">
                <input type="checkbox" md3-input-element name="indeterminate">
            </md3-switch>
        </label>
    </div>

    <div md3-type-body size="large">Thickness</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="thickness">
                <input type="radio" md3-input-element name="thickness" value="4">
            </md3-radio-button>
            <div md3-type-label size="large">4dp</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="thickness">
                <input type="radio" md3-input-element name="thickness" value="8">
            </md3-radio-button>
            <div md3-type-label size="large">8dp</div>
        </label>
    </div>

    <div md3-type-body size="large">Progress</div>
    <div class="controls-list">
        <div style="padding: 0 1em;">
            <md3-slider slider-size="x-small" [control]="progress">
                <md3-icon md3-icon-element>percent</md3-icon>
                <input type="range" md3-input-element min="0" max="100" step="1" name="progress">
            </md3-slider>
            <div md3-type-label size="small" style="text-align: end;">{{ progress.value }}%</div>
        </div>
    </div>
</md3-side-sheet-body>
