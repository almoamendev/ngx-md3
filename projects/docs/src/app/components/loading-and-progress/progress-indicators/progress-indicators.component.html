<h1>Progress indicators</h1>

<h2>Circular indicators</h2>

<ul>
    <li>@Input() indeterminate: boolean = false;</li>
    <li>@Input() thickness: 4 | 8 = 4;</li>
    <li>@Input() progress: number = 0;</li>
</ul>

<div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
    <md3-circular-progress-indicator [progress]="75"></md3-circular-progress-indicator>
    <md3-circular-progress-indicator [indeterminate]="true"></md3-circular-progress-indicator>
</div>

<h2>Linear indicators</h2>

<ul>
    <li>@Input() indeterminate: boolean = false;</li>
    <li>@Input() thickness: 4 | 8 = 4;</li>
    <li>@Input() progress: number = 0;</li>
</ul>

<div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
    <md3-linear-progress-indicator [progress]="75"></md3-linear-progress-indicator>
    <md3-linear-progress-indicator [indeterminate]="true"></md3-linear-progress-indicator>
</div>
