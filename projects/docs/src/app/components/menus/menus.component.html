<h1>Menus</h1>

<ul>
    <li>md3-menu-item: @Input() selected: boolean = false;</li>
    <li>md3-menu-item: @Input() disabled: boolean = false;</li>
    <li>md3-menu-item: @Input() supporting-text?: string;</li>
    <li>md3-menu-item: @Input() trailing-text?: string;</li>
</ul>

<div class="demo-menu-grid">
    <section>
        <h2>Basic menu</h2>

        <md3-menu aria-label="File actions">
            <md3-menu-group>
                <button md3-menu-item>
                    <md3-icon md3-icon-element="leading">edit</md3-icon>
                    Rename
                </button>
                <button md3-menu-item trailing-text="Ctrl+C">
                    <md3-icon md3-icon-element="leading">content_copy</md3-icon>
                    Copy
                </button>
                <button md3-menu-item disabled>
                    <md3-icon md3-icon-element="leading">delete</md3-icon>
                    Delete
                </button>
            </md3-menu-group>
        </md3-menu>
    </section>

    <section>
        <h2>Grouped menu</h2>

        <md3-menu aria-label="Editor menu" menu-width="wide">
            <md3-menu-group group-label="Edit">
                <button md3-menu-item trailing-text="Ctrl+Z">Undo</button>
                <button md3-menu-item trailing-text="Ctrl+Y">Redo</button>
            </md3-menu-group>

            <md3-menu-group group-label="View">
                <button md3-menu-item selected item-role="menuitemcheckbox">
                    Show ruler
                </button>
                <button md3-menu-item item-role="menuitemcheckbox">
                    Show minimap
                </button>
            </md3-menu-group>
        </md3-menu>
    </section>

    <section>
        <h2>Supporting text</h2>

        <md3-menu aria-label="Account menu">
            <md3-menu-group>
                <button md3-menu-item supporting-text="Use your personal workspace">
                    Personal
                </button>
                <button md3-menu-item selected supporting-text="Shared by your team">
                    Team
                </button>
                <button md3-menu-item supporting-text="Manage billing and access">
                    Settings
                </button>
            </md3-menu-group>
        </md3-menu>
    </section>
</div>
