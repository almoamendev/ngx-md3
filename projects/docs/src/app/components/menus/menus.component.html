<h1>Menus</h1>

<ul>
    <li>md3-menu-item: @Input() selected: boolean = false;</li>
    <li>md3-menu-item: @Input() disabled: boolean = false;</li>
    <li>md3-menu-item: @Input() supporting-text?: string;</li>
    <li>md3-menu-item: @Input() trailing-text?: string;</li>
</ul>

<div class="demo-menu-grid">
    <section>
        <h2>Basic menu</h2>

        <md3-menu aria-label="File actions">
            <md3-menu-group>
                <button md3-menu-item [selected]="false">
                    <md3-icon md3-icon-element="leading">edit</md3-icon>
                    <div md3-type-label="large">Rename</div>
                    <md3-badge>New</md3-badge>
                    <md3-icon md3-icon-element="trailing">arrow_right</md3-icon>
                </button>
                <button md3-menu-item>
                    <md3-icon md3-icon-element="leading">content_copy</md3-icon>
                    <div md3-type-label="large">Copy</div>
                    <div md3-type-title="small">Ctrl+C</div>
                </button>
                <button md3-menu-item disabled>
                    <md3-icon md3-icon-element="leading">delete</md3-icon>
                    <div md3-type-label="large">Delete</div>
                </button>
            </md3-menu-group>
        </md3-menu>

        <md3-menu aria-label="File actions" menu-color="vibrant">
            <md3-menu-group>
                <button md3-menu-item [selected]="false">
                    <md3-icon md3-icon-element="leading">edit</md3-icon>
                    <div md3-type-label="large">Rename</div>
                    <md3-badge>New</md3-badge>
                    <md3-icon md3-icon-element="trailing">arrow_right</md3-icon>
                </button>
                <button md3-menu-item>
                    <md3-icon md3-icon-element="leading">content_copy</md3-icon>
                    <div md3-type-label="large">Copy</div>
                    <div md3-type-title="small">Ctrl+C</div>
                </button>
                <button md3-menu-item disabled>
                    <md3-icon md3-icon-element="leading">delete</md3-icon>
                    <div md3-type-label="large">Delete</div>
                </button>
            </md3-menu-group>
        </md3-menu>
    </section>

    <section>
        <h2>Grouped menu</h2>

        <md3-menu aria-label="Editor menu">
            <md3-menu-group group-label="Edit">
                <button md3-menu-item>
                    <div md3-type-label="large">Undo</div>
                </button>
                <button md3-menu-item>
                    <div md3-type-label="large">Redo</div>
                </button>
            </md3-menu-group>

            <md3-menu-group group-label="View">
                <button md3-menu-item>
                    <div md3-type-label="large">Show ruler</div>
                </button>
                <button md3-menu-item>
                    <div md3-type-label="large">Show minimap</div>
                </button>
            </md3-menu-group>
        </md3-menu>

        <md3-menu aria-label="Editor menu" menu-color="vibrant">
            <md3-menu-group group-label="Edit">
                <button md3-menu-item>
                    <div md3-type-label="large">Undo</div>
                </button>
                <button md3-menu-item>
                    <div md3-type-label="large">Redo</div>
                </button>
            </md3-menu-group>

            <md3-menu-group group-label="View">
                <button md3-menu-item>
                    <div md3-type-label="large">Show ruler</div>
                </button>
                <button md3-menu-item>
                    <div md3-type-label="large">Show minimap</div>
                </button>
            </md3-menu-group>
        </md3-menu>
    </section>

    <section>
        <h2>Supporting text</h2>

        <md3-menu aria-label="Account menu">
            <md3-menu-group>
                <button md3-menu-item>
                    <div md3-type-label="large">Personal</div>
                    <div md3-type-body="small">Use your personal workspace</div>
                </button>
                <button md3-menu-item [selected]="true">
                    <div md3-type-label="large">Team</div>
                    <div md3-type-body="small">Shared by your team</div>
                </button>
                <button md3-menu-item>
                    <div md3-type-label="large">Settings</div>
                    <div md3-type-body="small">Manage billing and access</div>
                </button>
            </md3-menu-group>
        </md3-menu>

        <md3-menu aria-label="Account menu" menu-color="vibrant">
            <md3-menu-group>
                <button md3-menu-item>
                    <div md3-type-label="large">Personal</div>
                    <div md3-type-body="small">Use your personal workspace</div>
                </button>
                <button md3-menu-item [selected]="true">
                    <div md3-type-label="large">Team</div>
                    <div md3-type-body="small">Shared by your team</div>
                </button>
                <button md3-menu-item>
                    <div md3-type-label="large">Settings</div>
                    <div md3-type-body="small">Manage billing and access</div>
                </button>
            </md3-menu-group>
        </md3-menu>
    </section>
</div>
