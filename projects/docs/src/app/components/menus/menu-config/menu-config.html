<md3-side-sheet-header title="Configurations">
    <button type="button" md3-icon-button trailing button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>close</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body class="md3-component-config">
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label="large">Vibrant colors</div>
            <md3-switch disable-state-layer [control]="vibrant">
                <input type="checkbox" md3-input-element name="vibrant-colors">
            </md3-switch>
        </label>
        <label md3-state-component tabindex="0">
            <div md3-type-label="large">Overlap trigger</div>
            <md3-switch disable-state-layer [control]="overlapTrigger">
                <input type="checkbox" md3-input-element name="overlap-trigger">
            </md3-switch>
        </label>
    </div>

    <div md3-type-body="large">Horizontal position</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="xPosition">
                <input type="radio" md3-input-element name="menu-x-pos" value="start">
            </md3-radio-button>
            <div md3-type-label="large">Start</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="xPosition">
                <input type="radio" md3-input-element name="menu-x-pos" value="end">
            </md3-radio-button>
            <div md3-type-label="large">End</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="xPosition">
                <input type="radio" md3-input-element name="menu-x-pos" value="before">
            </md3-radio-button>
            <div md3-type-label="large">Before</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="xPosition">
                <input type="radio" md3-input-element name="menu-x-pos" value="after">
            </md3-radio-button>
            <div md3-type-label="large">After</div>
        </label>
    </div>

    <div md3-type-body="large">Vertical position</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="yPosition">
                <input type="radio" md3-input-element name="menu-y-pos" value="above">
            </md3-radio-button>
            <div md3-type-label="large">Above</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="yPosition">
                <input type="radio" md3-input-element name="menu-y-pos" value="below">
            </md3-radio-button>
            <div md3-type-label="large">Below</div>
        </label>
    </div>
</md3-side-sheet-body>
