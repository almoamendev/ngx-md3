<div class="title-actions">
    <h2>{{ title() }}</h2>
    <div class="actions">
        <button md3-button button-type="tonal" button-squared [selected]="rtl()" (click)="toggleRtl()">
            {{ rtl() ? 'RTL' : 'LTR' }}
        </button>
        <button md3-icon-button button-type="tonal" button-squared [selected]="!darkMode()" (click)="toggleDarkMode()">
            <md3-icon md3-icon-element>{{ darkMode() ? 'dark_mode' : 'light_mode' }}</md3-icon>
        </button>
        <ng-content select="[action-item]"></ng-content>
    </div>
</div>
<md3-card class="md3-scrollable" card-type="outlined" [dir]="rtl() ? 'rtl' : 'ltr'" [ngClass]="{
    'md-scheme-light': !darkMode(),
    'md-scheme-dark': darkMode(),
    'bg-variant': backgroundVariant(),
}">
    <ng-content></ng-content>
</md3-card>
