<h1>Checkboxes</h1>

<ul>
    <li>@Input() disable-state-layer: boolean = false;</li>
</ul>

<div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
    <md3-checkbox>
        <input type="checkbox" md3-input-element>
    </md3-checkbox>
    <md3-checkbox>
        <input type="checkbox" md3-input-element aria-invalid="true">
    </md3-checkbox>
    <md3-checkbox>
        <input type="checkbox" md3-input-element disabled>
    </md3-checkbox>
    <md3-checkbox>
        <input type="checkbox" md3-input-element disabled checked>
    </md3-checkbox>
</div>
