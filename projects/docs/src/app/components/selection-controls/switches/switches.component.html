<div style="display: flex; gap: 1rem;">
    <md3-switch>
        <input md3-input-element type="checkbox" />
    </md3-switch>

    <md3-switch>
        <input md3-input-element type="checkbox" />
        <md3-icon md3-icon-element>volume_up</md3-icon>
    </md3-switch>

    <md3-switch>
        <input md3-input-element type="checkbox" />
        <md3-icon md3-icon-element="unselected">close</md3-icon>
    </md3-switch>

    <md3-switch>
        <input md3-input-element type="checkbox" />
        <md3-icon md3-icon-element="selected">check</md3-icon>
    </md3-switch>

    <md3-switch>
        <input md3-input-element type="checkbox" />
        <md3-icon md3-icon-element="unselected">close</md3-icon>
        <md3-icon md3-icon-element="selected">check</md3-icon>
    </md3-switch>

    <md3-switch>
        <input md3-input-element type="checkbox" disabled />
        <md3-icon md3-icon-element="unselected">close</md3-icon>
        <md3-icon md3-icon-element="selected">check</md3-icon>
    </md3-switch>

    <md3-switch>
        <input md3-input-element type="checkbox" disabled checked />
        <md3-icon md3-icon-element="unselected">close</md3-icon>
        <md3-icon md3-icon-element="selected">check</md3-icon>
    </md3-switch>
</div>
