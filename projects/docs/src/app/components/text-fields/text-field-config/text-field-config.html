<md3-side-sheet-header title="Configurations">
    <button type="button" md3-icon-button trailing button-type="standard" (click)="close()">
        <md3-icon md3-icon-element>close</md3-icon>
    </button>
</md3-side-sheet-header>
<md3-side-sheet-body class="md3-component-config">
    <div md3-type-body size="large">Field type</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="fieldType">
                <input type="radio" md3-input-element name="field-type" value="filled">
            </md3-radio-button>
            <div md3-type-label size="large">Filled</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="fieldType">
                <input type="radio" md3-input-element name="field-type" value="outlined">
            </md3-radio-button>
            <div md3-type-label size="large">Outlined</div>
        </label>
    </div>

    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Leading icon</div>
            <md3-switch disable-state-layer [control]="leadingIcon">
                <input type="checkbox" md3-input-element name="leading-icon">
            </md3-switch>
        </label>
    </div>

    <div md3-type-body size="large">Trailing</div>
    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="trailingIcon">
                <input type="radio" md3-input-element name="trailing-icon" value="none">
            </md3-radio-button>
            <div md3-type-label size="large">None</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="trailingIcon">
                <input type="radio" md3-input-element name="trailing-icon" value="icon">
            </md3-radio-button>
            <div md3-type-label size="large">Icon</div>
        </label>
        <label md3-state-component tabindex="0">
            <md3-radio-button disable-state-layer [control]="trailingIcon">
                <input type="radio" md3-input-element name="trailing-icon" value="button">
            </md3-radio-button>
            <div md3-type-label size="large">Icon button</div>
        </label>
    </div>

    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Supporting text</div>
            <md3-switch disable-state-layer [control]="supportingText">
                <input type="checkbox" md3-input-element name="supporting-text">
            </md3-switch>
        </label>
    </div>

    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Character counter</div>
            <md3-switch disable-state-layer [control]="counter">
                <input type="checkbox" md3-input-element name="counter">
            </md3-switch>
        </label>
    </div>

    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Textarea</div>
            <md3-switch disable-state-layer [control]="textarea">
                <input type="checkbox" md3-input-element name="textarea">
            </md3-switch>
        </label>
    </div>

    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Error</div>
            <md3-switch disable-state-layer [control]="error">
                <input type="checkbox" md3-input-element name="error">
            </md3-switch>
        </label>
    </div>

    <div class="controls-list">
        <label md3-state-component tabindex="0">
            <div md3-type-label size="large">Disabled</div>
            <md3-switch disable-state-layer [control]="disabled">
                <input type="checkbox" md3-input-element name="disabled">
            </md3-switch>
        </label>
    </div>
</md3-side-sheet-body>
