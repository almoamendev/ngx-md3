<div class="md3-bar-region md3-bar-region-top">
    <ng-content select="[md3-scaffold-bar=top]"></ng-content>
</div>

<ng-content select="[md3-scaffold-rail=leading]"></ng-content>

<div class="md3-panes-container" #panesContainer>
    <div class="md3-pane md3-pane-start">
        <ng-content select="[md3-scaffold-pane=start]"></ng-content>
        <ng-template #startOutlet cdkPortalOutlet></ng-template>
    </div>
    <div class="md3-pane md3-pane-main">
        <ng-content select="[md3-scaffold-pane=main]"></ng-content>
    </div>
    <div class="md3-pane md3-pane-end">
        <ng-content select="[md3-scaffold-pane=end]"></ng-content>
        <ng-template #endOutlet cdkPortalOutlet></ng-template>
    </div>
</div>

<!-- Standard bottom sheets dock here, between the content and the bottom bar. The region
     measures zero until one opens, so it reserves nothing the rest of the time. -->
<div class="md3-bottom-sheet-region">
    <ng-template #bottomOutlet cdkPortalOutlet></ng-template>
</div>

<ng-content select="[md3-scaffold-rail=trailing]"></ng-content>

<div class="md3-bar-region md3-bar-region-bottom">
    <ng-content select="[md3-scaffold-bar=bottom]"></ng-content>
</div>
