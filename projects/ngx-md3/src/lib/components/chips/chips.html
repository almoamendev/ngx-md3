@if (isSelectable()) {
    <ng-content select="[md3-input-element]"></ng-content>
}
<div class="md3-chip-container" md3-state-component>
    <div class="md3-chip-leading" [class.has-icon]="leading()" [class.has-avatar]="hasAvatar()">
        <ng-content select="[md3-icon-element=leading], [md3-chip-avatar]"></ng-content>
        @if (showCheckIcon()) {
            <md3-icon [icon-size]="18">check</md3-icon>
        }
    </div>
    <div class="md3-chip-label">
        <ng-content></ng-content>
    </div>
    @if (hasRemove()) {
        <button class="md3-chip-trailing" md3-state-component (click)="onRemoveClick($event)">
            <ng-container [ngTemplateOutlet]="trailingContent"></ng-container>
        </button>
    } @else {
        <div class="md3-chip-trailing" [class.has-icon]="trailing()">
            <ng-container [ngTemplateOutlet]="trailingContent"></ng-container>
        </div>
    }
</div>

<ng-template #trailingContent>
    <ng-content select="[md3-icon-element=trailing]"></ng-content>

    @if (hasRemove() && !trailing) {
        <md3-icon [icon-size]="18">close</md3-icon>
    }
</ng-template>
