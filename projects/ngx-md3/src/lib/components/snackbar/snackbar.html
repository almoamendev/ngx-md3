<div
    class="md3-snackbar-container"
    [class.md3-active]="isActive()"
    [class.md3-snackbar-stacked]="isStacked"
    [ngClass]="{
        'md-scheme-light': config.scheme == 'dark',
        'md-scheme-dark': config.scheme == 'light',
    }"
    [attr.dir]="config.direction ?? null"
    [attr.role]="role"
    [attr.aria-live]="config.politeness ?? 'polite'"
    [attr.aria-label]="config.ariaLabel || null">
    <div class="md3-snackbar-message">
        @if (isTemplateMessage) {
            <ng-container *ngTemplateOutlet="templateMessage; context: templateContext"></ng-container>
        } @else {
            <div md3-type-body size="medium">{{ textMessage }}</div>
        }
    </div>

    @if (actionLabel) {
        <button md3-button type="button" class="md3-snackbar-action" button-type="text" button-size="small" (click)="onActionClick()">
            {{ actionLabel }}
        </button>
    }

    @if (config.showCloseIcon) {
        <button md3-icon-button type="button" class="md3-snackbar-close" button-type="standard" button-size="small" aria-label="Dismiss" (click)="onCloseClick()">
            <md3-icon md3-icon-element>close</md3-icon>
        </button>
    }
</div>
