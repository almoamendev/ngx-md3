<div class="md3-item-container">
    @if (hasIcons()) {
        <div class="md3-icon-container">
            <ng-content select="[md3-icon-element=active]"></ng-content>
            <ng-content select="[md3-icon-element]"></ng-content>
        </div>
    }
    <div class="md3-label">
        <ng-content></ng-content>
    </div>
    @if (hasIcons() && badge()) {
        <div class="md3-badge-container" [class.md3-small]="badge()?.isSmall()">
            <ng-content select="md3-badge"></ng-content>
        </div>
    }
</div>
