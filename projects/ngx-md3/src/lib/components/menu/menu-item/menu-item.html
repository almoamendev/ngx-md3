<div class="md3-menu-item-leading">
    <ng-content select="[md3-icon-element=leading]"></ng-content>
</div>

<div class="md3-menu-item-content">
    <div class="md3-menu-item-label">
        <ng-content></ng-content>
    </div>

    @if (supportingText) {
        <div class="md3-menu-item-supporting-text">{{ supportingText }}</div>
    }
</div>

<div class="md3-menu-item-trailing">
    @if (trailingText) {
        <div class="md3-menu-item-trailing-text">{{ trailingText }}</div>
    }

    <ng-content select="[md3-icon-element=trailing], [md3-menu-trailing]"></ng-content>
</div>
