@if (selected !== null) {
    <input type="checkbox" md3-input-element [checked]="selected">
}

<div class="md3-menu-item-container" md3-state-component>
    <div class="md3-menu-item-leading" [class.has-icon]="!!leading">
        <ng-content select="[md3-icon-element=leading]"></ng-content>
    </div>

    <div class="md3-menu-item-content">
        <ng-content select="[md3-type-label=large]"></ng-content>
        <ng-content select="[md3-type-body=small]"></ng-content>
    </div>

    <div class="md3-menu-item-trailing">
        <ng-content select="md3-badge"></ng-content>
        <ng-content select="[md3-type-title=small]"></ng-content>
        <ng-content select="[md3-icon-element=trailing]"></ng-content>
    </div>
</div>
