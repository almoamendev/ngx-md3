@if (selected() !== null) {
    <input type="checkbox" md3-input-element [checked]="selected()">
}

<div class="md3-menu-item-container" md3-state-component>
    <div class="md3-menu-item-leading" [class.has-icon]="showLeadingIcon">
        <ng-content select="[md3-icon-element=leading]"></ng-content>
        @if (!leading) {
            <md3-icon>check</md3-icon>
        }
    </div>

    <div class="md3-menu-item-content">
        <md3-type-label size="large">{{ label() }}</md3-type-label>
        @if (supportingText()?.length) {
            <md3-type-body size="small">{{ supportingText() }}</md3-type-body>
        }
    </div>

    <div class="md3-menu-item-trailing">
        <ng-content select="md3-badge"></ng-content>
        @if (trailingText()?.length) {
            <md3-type-title size="small">{{ trailingText() }}</md3-type-title>
        }
        <ng-content select="[md3-icon-element=trailing]"></ng-content>
    </div>
</div>
