<div #inputContainer class="md3-text-field-container">
    <ng-content></ng-content>
    @if (label) {
    <div class="md3-text-field-label">{{ label }}</div>
    }
    <ng-content select="[md3-icon-element=leading]"></ng-content>
    <ng-content select="[md3-icon-button], [md3-icon-element=trailing]"></ng-content>
    <div class="md3-text-field-state"></div>
</div>
<div class="md3-supporting-text-container" [class.has-error]="hasError">
    <ng-content select="[md3-supporting-text]"></ng-content>
    @if (inputCounter) {
        <div class="md3-text-input-counter">{{ valueLength + (maxLength ? "/" + maxLength : "") }}</div>
    }
</div>
