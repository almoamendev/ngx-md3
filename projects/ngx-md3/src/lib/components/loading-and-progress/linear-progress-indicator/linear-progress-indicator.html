<div class="linear-indicator" [class.thickness-8dp]="thickness == 8" [style.--progress]="progress + '%'">
    <div class="track"></div>
    <div class="active-indicator"></div>
</div>

<div class="linear-indicator indeterminate" [class.thickness-8dp]="thickness == 8" style="margin-top: 1rem;">
    <div class="track"></div>
    <div class="active-indicator"></div>
</div>
