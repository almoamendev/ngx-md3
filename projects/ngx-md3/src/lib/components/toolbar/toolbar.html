<div class="md3-toolbar-layout" #layout>
    @if (isFloating()) {
        <ng-content select="[md3-fab]"></ng-content>
    }
    
    <div class="md3-toolbar-container" #container>
        <div class="md3-toolbar-slots" #slots>
            <ng-content select="md3-toolbar-item"></ng-content>
        </div>
    </div>
</div>
