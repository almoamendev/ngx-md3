<!-- The role and aria attributes live on the host element, applied by the CDK dialog container.
     The portal outlet stays in this template, as the CDK requires, and is projected into the
     shared surface. -->
<md3-bottom-sheet-surface
    [showHandle]="config.handle ?? true"
    [allowGestures]="config.gestures ?? true"
    [scheme]="config.scheme ?? 'inherit'"
    [direction]="config.direction ?? null">
    <ng-template cdkPortalOutlet></ng-template>
</md3-bottom-sheet-surface>
