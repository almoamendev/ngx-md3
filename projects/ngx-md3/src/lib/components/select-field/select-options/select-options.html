<md3-menu-group class="md3-scrollable">
    @for (item of renderedOptions(); track item.value) {
        <button
            md3-menu-item
            [selected]="item.selected ?? false"
            [label]="item.label"
            [supporting-text]="item.supportingText ?? null"
            [trailing-text]="item.trailingText ?? null"
            (mousedown)="$event.preventDefault()"
            (click)="optionClick(item)"
        >
        </button>
    }
</md3-menu-group>
