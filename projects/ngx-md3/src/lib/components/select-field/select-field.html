<md3-text-field [label]="label()" [field-type]="fieldType()" [control]="formControl()">
    <!-- <md3-icon md3-icon-element="leading">search</md3-icon> -->
    @if (hasLeadingIcon()) {
        <div md3-icon-element="leading">
            <ng-content select="[md3-icon-element=leading]"></ng-content>
        </div>
    }

    <input md3-input-element type="text" [readonly]="true" [disabled]="isDisabled()" (click)="openMenu()" class="md3-select-input" [class.md3-menu-active]="isMenuOpen()" [value]="selectedText()">

    <button md3-icon-button button-type="standard" [disabled]="isDisabled()" (click)="toggleMenu()" class="md3-select-arrow">
        @if (hasArrowIcon()) {
            <ng-content select="[md3-icon-element=arrow]"></ng-content>
        } @else {
            <md3-icon md3-icon-element>arrow_drop_down</md3-icon>
        }
    </button>

    <ng-content select="[md3-supporting-text]" ngProjectAs="[md3-supporting-text]"></ng-content>
</md3-text-field>
